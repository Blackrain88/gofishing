      <div class="section">
        <h2>정보</h2>
        <div class="setrow"><div class="grow"><div class="t">바다가자</div>
          <div class="d">1~2단계 (로컬 저장 · 사진)</div></div><div class="t">${APP_VERSION}</div></div>
        <button class="setrow" data-refresh><div class="grow"><div class="t">최신 버전 받기</div>
          <div class="d">고친 내용이 반영되지 않을 때 누르세요</div></div><span class="chev">›</span></button>
      </div>
    </div>
  </div>`;

  const app = $('#app');
  app.querySelector('[data-back]').onclick = back;

  // 사진 통계는 blob 을 다 읽어야 하므로 화면을 띄운 뒤 따로 계산한다
  (async () => {
    try{
      const rows = (await dbAll('images')).filter(r => !r.deleted);
      const bytes = rows.reduce((a,r) => a + (r.bytes||0) + (r.thumb?.size||0), 0);
      const cnt = app.querySelector('[data-imgcount]'), sz = app.querySelector('[data-imgsize]');
      if(cnt) cnt.textContent = rows.length + '장';
      if(sz)  sz.textContent  = rows.length ? (bytes/1048576).toFixed(1) + ' MB 사용 중' : '아직 없음';
    }catch(e){ console.error(e); }
  })();

  // ---- 동기화 ----
  app.querySelector('[data-synctoggle]').onclick = async () => {
    state.ui.syncOn = !state.ui.syncOn;
    await saveUI();
    if(state.ui.syncOn && !SYNC.ready) toast('주소와 토큰을 입력한 뒤 저장해 주세요');
    else if(!state.ui.syncOn) toast('동기화를 껐습니다 — 이제 폰에만 저장합니다');
    renderSettings();
    if(state.ui.syncOn && !SYNC.ready) $('[data-syncurl]')?.focus();
  };

  app.querySelectorAll('[data-syncmode]').forEach(b => b.onclick = async () => {
    state.ui.syncMode = b.dataset.syncmode;
    await saveUI(); renderSettings();
  });

  // ---- 백업 파일 방식 ----
  const bstat = app.querySelector('[data-backupstat]');
  function refreshBackupStat(){
    if(!bstat) return;
    const n = changedSinceBackup();
    const when = state.ui.backupAt ? new Date(state.ui.backupAt).toLocaleString('ko-KR') : '아직 없음';
    bstat.textContent = n ? `마지막 백업 이후 ${n}건 바뀜 · 마지막 ${when}` : `마지막 ${when}`;
  }
  refreshBackupStat();

  app.querySelector('[data-backup]')?.addEventListener('click', async () => {
    try{
      const r = await shareBackup(msg => { if(bstat) bstat.textContent = msg; });
      if(r) toast(`백업 완료 — 포인트 ${r.points} · 출조 ${r.trips} · 사진 ${r.images}`);
    }catch(e){ toast('백업 실패: ' + e.message); }
    refreshBackupStat();
  });
  const bfile = app.querySelector('[data-backupfile]');
  app.querySelector('[data-restorefile]')?.addEventListener('click', () => bfile.click());
  if(bfile) bfile.onchange = async () => {
    const f = bfile.files[0]; bfile.value = '';
    if(!f) return;
    if(!confirm('백업 파일의 내용을 현재 기록에 합칩니다. 계속할까요?')) return;
    try{
      const r = await restoreBackup(f, msg => { if(bstat) bstat.textContent = msg; });
      toast(`복원 완료 — 포인트 ${r.points} · 출조 ${r.trips} · 사진 ${r.images}`);
      renderSettings();
    }catch(e){ toast('복원 실패: ' + e.message); refreshBackupStat(); }
  };

  const statEl = app.querySelector('[data-syncstat]');
  async function refreshSyncStat(){
    if(!statEl) return;
    if(!SYNC.ready){ statEl.textContent = '주소와 토큰을 입력해 주세요'; return; }
    try{
      const c = await unsyncedCount();
      const when = state.ui.syncedAt ? new Date(state.ui.syncedAt).toLocaleString('ko-KR') : '아직 없음';
      statEl.textContent = c.total
        ? `올릴 것 ${c.total}건 (기록 ${c.points+c.trips} · 사진 ${c.images}) · 마지막 ${when}`
        : `모두 올렸습니다 · 마지막 ${when}`;
    }catch(e){ statEl.textContent = '상태를 읽지 못했습니다'; }
  }
  refreshSyncStat();

  const bodyEl = app.querySelector('[data-syncbody]');
  if(!bodyEl) { /* 꺼진 상태 — 아래 핸들러들은 붙일 대상이 없다 */ }

  app.querySelector('[data-syncsave]')?.addEventListener('click', async () => {
    state.ui.syncUrl   = app.querySelector('[data-syncurl]').value.trim();
    state.ui.syncToken = app.querySelector('[data-synctoken]').value.trim();
    await saveUI();
    toast(SYNC.ready ? '저장했습니다' : '주소와 토큰을 모두 넣어 주세요');
    renderSettings();
  });
  app.querySelector('[data-synctest]')?.addEventListener('click', async () => {
    const url = app.querySelector('[data-syncurl]').value.trim();
    const tok = app.querySelector('[data-synctoken]').value.trim();
    if(!url || !tok) return toast('주소와 토큰을 모두 넣어 주세요');
    const keep = [state.ui.syncUrl, state.ui.syncToken];
    state.ui.syncUrl = url; state.ui.syncToken = tok;
    try{
      const j = await api('ping', {});
      toast('연결 성공' + (j.sheet ? ` — ${j.sheet}` : ''));
    }catch(e){
      [state.ui.syncUrl, state.ui.syncToken] = keep;
      toast('연결 실패: ' + e.message);
    }
  });
  app.querySelector('[data-extras]')?.addEventListener('click', async () => {
    state.ui.syncExtras = !state.ui.syncExtras;
    await saveUI(); renderSettings();
  });
  app.querySelector('[data-syncnow]')?.addEventListener('click', async () => {
    if(!SYNC.ready) return toast('먼저 주소와 토큰을 저장해 주세요');
    try{
      const r = await syncNow(msg => { if(statEl) statEl.textContent = msg; });
      toast(r ? `올렸습니다 — 기록 ${r.records}건 · 사진 ${r.images}장` : '이미 동기화 중입니다');
    }catch(e){ toast('동기화 실패: ' + e.message); }
    refreshSyncStat();
  });
  app.querySelector('[data-restore]')?.addEventListener('click', async () => {
    if(!SYNC.ready) return toast('먼저 주소와 토큰을 저장해 주세요');
    if(!confirm('클라우드의 기록을 내려받아 합칩니다. 계속할까요?')) return;
    try{
      const r = await restoreFromCloud(msg => { if(statEl) statEl.textContent = msg; });
      toast(`복원 완료 — 포인트 ${r.points} · 출조 ${r.trips} · 사진 ${r.images}`);
      renderSettings();
    }catch(e){ toast('복원 실패: ' + e.message); refreshSyncStat(); }
  });

  app.querySelector('[data-export]').onclick = () => {
    const data = { app:'badagaja', version:1, exportedAt:new Date().toISOString(),
                   points:state.points, trips:state.trips, presets:state.presets };
    const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `badagaja-${todayStr()}.json`;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    toast('내보냈습니다');
  };

  const file = app.querySelector('[data-file]');
  app.querySelector('[data-import]').onclick = () => file.click();
  file.onchange = async () => {
    const f = file.files[0]; if(!f) return;
    try{
      const data = JSON.parse(await f.text());
      if(data.app !== 'badagaja') throw new Error('형식이 다릅니다');
      let n = 0;
      for(const p of (data.points||[])){ await dbPut('points', p); n++; }
      for(const t of (data.trips ||[])){ await dbPut('trips',  t); n++; }
      if(data.presets){ state.presets = data.presets; await savePresets(); }
      await loadAll();
      toast(`${n}건을 가져왔습니다`);
      renderSettings();
    }catch(e){ toast('가져오기 실패: ' + e.message); }
    file.value = '';
  };

  app.querySelectorAll('[data-rmpreset]').forEach(b => b.onclick = async () => {
    const [t,i] = b.dataset.rmpreset.split(':');
    state.presets[t].splice(+i,1); await savePresets(); renderSettings();
  });
  app.querySelectorAll('[data-addpreset]').forEach(b => b.onclick = async () => {
    const t = b.dataset.addpreset;
    const inp = app.querySelector(`[data-newpreset="${t}"]`);
    const v = inp.value.trim();
    if(!v) return;
    if(state.presets[t].includes(v)) return toast('이미 있습니다');
    state.presets[t].push(v); await savePresets(); renderSettings();
  });
  /* 캐시를 비우고 새로 받아온다. 저장한 기록(IndexedDB)은 건드리지 않는다. */
  app.querySelector('[data-refresh]').onclick = async () => {
    toast('최신 버전을 받는 중…');
    try{
      if('serviceWorker' in navigator){
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r => r.unregister()));
      }
      if(window.caches){
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k)));
      }
    }catch(e){ console.error(e); }
    location.reload();
  };

  app.querySelector('[data-resetpreset]').onclick = async () => {
    if(!confirm('프리셋을 기본값으로 되돌릴까요? 직접 추가한 항목은 사라집니다.')) return;
    state.presets = JSON.parse(JSON.stringify(DEFAULT_PRESETS));
    await savePresets(); renderSettings();
  };
}

/* ============================================================
   시작
   ============================================================ */
(async function init(){
  try{
    await openDB();
    await loadAll();
  }catch(e){
    $('#app').innerHTML = `<div class="empty"><div class="big">⚠️</div>
      <p><b>저장소를 열 수 없습니다</b></p><p>${esc(e.message||e)}</p>
      <p class="hint">시크릿 모드에서는 동작하지 않을 수 있습니다.</p></div>`;
    return;
  }
  // 사진이 쌓이면 브라우저가 저장공간을 정리해버릴 수 있으니 보존을 요청한다
  navigator.storage?.persist?.().catch(()=>{});
  setTimeout(() => sweepOrphanImages().catch(()=>{}), 3000);
  scheduleSync();
  window.addEventListener('online', scheduleSync);

  // 지도앱에서 "공유 → 바다가자"로 들어왔다면 곧바로 새 포인트 작성으로 들어간다
  if(captureShare()){
    const c = parseCoordsFromUrl(pendingShare.url);
    newPointPrefill = { mapLink: pendingShare.url, title: pendingShare.title || '', locMode:'link', fromShare: true };
    if(c){ newPointPrefill.lat = c.lat; newPointPrefill.lng = c.lng; }
    go('#/p/new');
  } else route();
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
})();
</script>

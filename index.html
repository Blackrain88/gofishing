<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3d5c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>바다가자</title>
<style>
:root{
  --bg:#f4f7f9; --card:#ffffff; --fg:#132430; --dim:#5d7080; --line:#dde5ea;
  --accent:#0b6ea8; --accent-fg:#fff;
  --walking:#1f7a5a; --walking-bg:#e3f4ec;
  --haerujil:#a8611f; --haerujil-bg:#fbeee0;
  --danger:#c0392b;
  --shadow:0 1px 3px rgba(19,36,48,.10),0 6px 18px rgba(19,36,48,.06);
  --r:14px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1620; --card:#17222e; --fg:#e6edf3; --dim:#93a6b5; --line:#26343f;
    --accent:#3fa3dd; --accent-fg:#07222f;
    --walking:#5ddba8; --walking-bg:#12342a;
    --haerujil:#e8a765; --haerujil-bg:#3a2814;
    --danger:#ff7b6b;
    --shadow:0 1px 3px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg);color:var(--fg);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:var(--accent)}

/* ---------- layout ---------- */
#app{min-height:100%;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;min-height:100%}
.topbar{
  position:sticky;top:0;z-index:20;background:var(--card);
  border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;
}
.topbar-row{display:flex;align-items:center;gap:10px;min-height:34px}
.topbar h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.02em;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  color:var(--dim);flex:none}
.iconbtn:active{background:var(--line)}
.iconbtn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.body{flex:1;padding:12px 12px calc(88px + var(--safe-b))}

/* ---------- tabs / seg ---------- */
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 4px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--dim);
  white-space:nowrap;transition:background .12s}
.seg button[aria-pressed=true]{background:var(--card);color:var(--fg);box-shadow:var(--shadow)}

/* ---------- search ---------- */
.searchwrap{position:relative;margin-top:10px}
.searchwrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);
  width:17px;height:17px;stroke:var(--dim);fill:none;stroke-width:2;pointer-events:none}
.search{width:100%;padding:10px 34px 10px 34px;border:1px solid var(--line);border-radius:11px;
  background:var(--bg);outline:none}
.search:focus{border-color:var(--accent)}
.clearbtn{position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--dim)}
.clearbtn svg{position:static;transform:none;width:14px;height:14px;stroke:currentColor}

.toolrow{display:flex;align-items:center;gap:8px;margin-top:10px}
.count{font-size:12.5px;color:var(--dim);flex:1}
.minisel{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:5px 8px;
  font-size:12.5px;color:var(--dim)}

/* ---------- list ---------- */
.list{display:flex;flex-direction:column;gap:9px}
.item{display:flex;gap:11px;background:var(--card);border-radius:var(--r);padding:11px;
  box-shadow:var(--shadow);align-items:flex-start;text-align:left;width:100%}
.item:active{transform:scale(.995)}
.thumb{width:56px;height:56px;border-radius:11px;flex:none;display:grid;place-items:center;font-size:24px;margin-top:2px}
.thumb.walking{background:var(--walking-bg)}
.thumb.haerujil{background:var(--haerujil-bg)}
.itembody{flex:1;min-width:0}
.itemtitle{font-weight:650;font-size:15.5px;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.itemloc{font-size:12.5px;color:var(--dim);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catchline{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.cchip{font-size:11px;line-height:1.5;padding:2px 7px;border-radius:6px;background:var(--bg);
  border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.cchip.more{border-style:dashed}
.cchip.tally{border-color:transparent;background:var(--bg);font-variant-numeric:tabular-nums}
.itemmeta{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;letter-spacing:-.01em}
.badge.walking{background:var(--walking-bg);color:var(--walking)}
.badge.haerujil{background:var(--haerujil-bg);color:var(--haerujil)}
.sub{font-size:11.5px;color:var(--dim)}

/* grid view */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);text-align:left}
.card .ph{aspect-ratio:4/3;display:grid;place-items:center;font-size:36px}
.card .ph.walking{background:var(--walking-bg)}
.card .ph.haerujil{background:var(--haerujil-bg)}
.card .cb{padding:9px 10px 11px}
.card .itemtitle{font-size:14.5px}

/* ---------- empty ---------- */
.empty{text-align:center;padding:56px 24px;color:var(--dim)}
.empty .big{font-size:44px;margin-bottom:12px}
.empty p{margin:6px 0;font-size:14px}

/* ---------- fab ---------- */
.fab{position:fixed;right:16px;bottom:calc(18px + var(--safe-b));z-index:30;
  height:52px;padding:0 20px;border-radius:26px;background:var(--accent);color:var(--accent-fg);
  font-weight:700;font-size:15px;box-shadow:0 6px 20px rgba(11,110,168,.36);
  display:flex;align-items:center;gap:7px}
.fab svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}

/* ---------- form ---------- */
.field{margin-bottom:16px}
.label{display:block;font-size:12.5px;font-weight:700;color:var(--dim);margin-bottom:6px;
  letter-spacing:.01em}
.label .req{color:var(--danger)}
.input,textarea.input,select.input{
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;
  background:var(--card);outline:none;-webkit-appearance:none;appearance:none}
select.input{background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),
  linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px}
.input:focus{border-color:var(--accent)}
textarea.input{resize:vertical;min-height:88px;line-height:1.55}
.row2{display:flex;gap:8px}
.row2>*{flex:1;min-width:0}
.hint{font-size:11.5px;color:var(--dim);margin-top:5px}

/* 입력칸 안쪽 지우기(X) */
.inputwrap{position:relative}
.input.has-clear{padding-right:40px}
.inclear{position:absolute;right:5px;top:50%;transform:translateY(-50%);
  width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--dim)}
.inclear:active{background:var(--line)}
.inclear svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}

/* combo */
.combo{position:relative}
.combo-pop{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:40;
  background:var(--card);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);
  max-height:210px;overflow:auto}
.combo-pop button{display:block;width:100%;text-align:left;padding:10px 12px;font-size:14.5px;
  border-bottom:1px solid var(--line)}
.combo-pop button:last-child{border-bottom:0}
.combo-pop button:active{background:var(--bg)}
.combo-pop .newitem{color:var(--accent);font-weight:650}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:9px;
  background:var(--bg);border:1px solid var(--line);font-size:13.5px}
.chip.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.chip .x{font-size:15px;line-height:1;opacity:.75;margin-left:1px}
.seasoncard{border:1px solid var(--line);border-radius:12px;padding:10px 11px;margin-bottom:8px;background:var(--bg)}
.seasoncard .presetbox{background:var(--card);border-style:solid}
.chip.addchip{border-style:dashed;color:var(--accent);font-weight:650}
.presetbox{margin-top:9px;padding:10px;border:1px dashed var(--line);border-radius:11px;background:var(--bg)}
.presetbox .ttl{font-size:11.5px;color:var(--dim);margin-bottom:7px;display:flex;align-items:center;gap:8px}
.presetbox .ttl button{font-size:11.5px;color:var(--accent);font-weight:650}
.addrow{display:flex;gap:6px;margin-top:9px}
.addrow .input{flex:1}
.btn-sm{padding:0 14px;border-radius:11px;background:var(--accent);color:var(--accent-fg);
  font-weight:650;font-size:14px;flex:none}
.btn-sm.ghost{background:var(--bg);color:var(--fg);border:1px solid var(--line)}

/* rows (season / catch-qty) */
.editrow{display:flex;gap:6px;align-items:center;margin-bottom:7px}
.editrow .input{padding:9px 10px}
.editrow select.input{flex:none;width:76px;padding-right:26px;background-position:calc(100% - 13px) 50%,calc(100% - 8px) 50%}
.editrow .tilde{color:var(--dim);font-size:13px;flex:none}
.delrow{width:32px;height:32px;flex:none;border-radius:9px;display:grid;place-items:center;color:var(--dim)}
.delrow:active{background:var(--line)}
.delrow svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.qtybox{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:9px;
  background:var(--card);flex:none}
.qtybox button{width:30px;height:32px;display:grid;place-items:center;color:var(--dim);font-size:17px}
.qtybox span{min-width:26px;text-align:center;font-size:14px;font-weight:650}

/* section */
.section{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-bottom:11px}
.section h2{margin:0 0 10px;font-size:13px;font-weight:700;color:var(--dim);letter-spacing:.02em;
  display:flex;align-items:center;gap:8px}
.section h2 .grow{flex:1}
.section h2 button{font-size:12.5px;color:var(--accent);font-weight:650}
.kv{font-size:14.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.muted{color:var(--dim);font-size:13.5px}

/* detail header */
.dhead{background:var(--card);padding:16px 14px;box-shadow:var(--shadow);border-radius:var(--r);margin-bottom:11px}
.dhead h1{margin:8px 0 4px;font-size:21px;font-weight:750;letter-spacing:-.02em;line-height:1.3}
.dloc{font-size:13px;color:var(--dim)}
.btnrow{display:flex;gap:8px;margin-top:13px}
.btn{flex:1;padding:11px;border-radius:11px;background:var(--accent);color:var(--accent-fg);
  font-weight:650;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:var(--bg);color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.sharebar{background:var(--walking-bg);border-radius:12px;padding:11px 13px;margin-bottom:14px}
.sharebar .sb-t{font-size:13.5px;font-weight:650;color:var(--walking);display:flex;align-items:center;gap:6px}
.sharebar .sb-t svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;flex:none}
.sharebar button{margin-top:7px;font-size:13px;font-weight:650;color:var(--accent)}
.btn.sm3{font-size:13px;padding:11px 2px;gap:4px}
.btn.sm3 svg{width:15px;height:15px}
.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* trip item */
.trip{display:block;width:100%;text-align:left;padding:11px 0;border-bottom:1px solid var(--line)}
.trip:last-child{border-bottom:0;padding-bottom:0}
.trip:first-child{padding-top:0}
.tripdate{font-weight:650;font-size:14.5px}
.triptime{font-size:12.5px;color:var(--dim);margin-top:2px}
.tripcatch{font-size:13.5px;margin-top:5px}
.tripmemo{font-size:12.5px;color:var(--dim);margin-top:4px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* 이미지 */
.imgrid{display:flex;flex-wrap:wrap;gap:8px}
.imgcell{width:84px;height:84px;border-radius:11px;position:relative;flex:none;
  border:1px solid var(--line);background:var(--bg) center/cover no-repeat}
.imgcell .rm{position:absolute;top:4px;right:4px;width:23px;height:23px;border-radius:50%;
  background:rgba(0,0,0,.55);display:grid;place-items:center}
.imgcell .rm svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round}
.imgadd{width:84px;height:84px;border-radius:11px;flex:none;border:1px dashed var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--dim);background:var(--bg)}
.imgadd svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.imgadd .lbl{font-size:11px;line-height:1.2;text-align:center;padding:0 4px}
.imgstrip{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.shotwide{width:100%;aspect-ratio:4/3;border-radius:11px;border:1px solid var(--line);
  background:var(--bg) center/cover no-repeat}
.imgstrip .shot{width:124px;height:124px;flex:none;border-radius:11px;border:1px solid var(--line);
  background:var(--bg) center/cover no-repeat}
.thumb.hasimg,.card .ph.hasimg{background-size:cover;background-position:center;font-size:0}

/* 켜기/끄기 스위치 */
.switch{width:42px;height:25px;border-radius:13px;background:var(--line);position:relative;flex:none;
  transition:background .15s}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;
  background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(17px)}

/* 모아 보기 */
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.gcell{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:1px solid var(--line);
  background:var(--bg) center/cover no-repeat;width:100%;text-align:left}
.gcell:active{opacity:.85}
.gcell .cap{position:absolute;left:0;right:0;bottom:0;padding:16px 6px 5px;color:#fff;font-size:10.5px;
  background:linear-gradient(transparent,rgba(0,0,0,.75));
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcell .kindbadge{position:absolute;top:4px;left:4px;font-size:9.5px;font-weight:700;
  padding:1px 5px;border-radius:4px;background:rgba(0,0,0,.6);color:#fff}
.minisel.gal{display:flex;align-items:center;gap:5px;white-space:nowrap;font-weight:600;color:var(--fg)}
.minisel.gal svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}

/* 전체 화면 뷰어 */
.viewer{position:fixed;inset:0;background:#000;z-index:80;display:flex;flex-direction:column}
.viewer .vtop{display:flex;align-items:center;gap:10px;color:#fff;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 8px}
.viewer .vcount{font-size:13px;opacity:.8;font-variant-numeric:tabular-nums}
.viewer .vimg{flex:1;display:grid;place-items:center;overflow:hidden;padding:4px}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.viewer .vnav{display:flex;justify-content:space-between;padding:10px 14px calc(14px + var(--safe-b))}
.viewer .iconbtn:active{background:rgba(255,255,255,.15)}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;
  display:flex;align-items:flex-end;animation:fade .15s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;background:var(--card);border-radius:18px 18px 0 0;
  padding:16px 14px calc(16px + var(--safe-b));animation:up .2s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(24px)}to{transform:translateY(0)}}
.sheet h3{margin:0 0 12px;font-size:16px;font-weight:700}
.sheet .btn{margin-bottom:8px}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + var(--safe-b));
  background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:22px;font-size:13.5px;
  font-weight:600;z-index:90;box-shadow:var(--shadow);animation:fade .15s}

/* settings */
.setrow{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line);
  width:100%;text-align:left}
.setrow:last-child{border-bottom:0}
.setrow .grow{flex:1;min-width:0}
.setrow .t{font-size:14.5px}
.setrow .d{font-size:12px;color:var(--dim);margin-top:2px}
.setrow .chev{color:var(--dim);font-size:18px}
</style>
</head>
<body>
<div id="app"></div>

<script>
'use strict';
/* ============================================================
   바다가자 — 출조 포인트 기록 앱  /  1단계: 본체 + 로컬 저장
   ============================================================ */

/* ---------- 상수 ---------- */
const APP_VERSION = 'v14';   // sw.js 의 VERSION 과 함께 올린다

const SIDO = ['서울','부산','대구','인천','광주','대전','울산','세종',
              '경기','강원','충북','충남','전북','전남','경북','경남','제주'];

const DEFAULT_PRESETS = {
  haerujil: ['낙지','주꾸미','소라','바지락','해삼','꽃게','대합','맛조개','개불','문어','가리비','굴','백합','갯가재'],
  walking : ['농어','광어','우럭','삼치','갑오징어','무늬오징어','한치','참돔','감성돔','볼락','도다리','학꽁치','전갱이','고등어','갈치']
};

const TYPE = {
  walking : { label:'워킹낚시', icon:'🎣' },
  haerujil: { label:'해루질',   icon:'🔦' }
};

const MONTHS = Array.from({length:12},(_,i)=>i+1);

/* ---------- 유틸 ---------- */
const $ = s => document.querySelector(s);
const uid = () => (Date.now().toString(36) + Math.random().toString(36).slice(2,9));
const now = () => Date.now();
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayStr = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const nowTimeStr = () => { const d=new Date(); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };

function fmtDate(s){
  if(!s) return '';
  const [y,m,d] = s.split('-').map(Number);
  const w = ['일','월','화','수','목','금','토'][new Date(y,m-1,d).getDay()];
  return `${y}. ${m}. ${d}. (${w})`;
}
function fmtDuration(min){
  if(min==null || isNaN(min)) return '';
  const h = Math.floor(min/60), m = min%60;
  return h ? (m ? `${h}시간 ${m}분` : `${h}시간`) : `${m}분`;
}
function diffMinutes(start,end){
  if(!start || !end) return null;
  const [sh,sm]=start.split(':').map(Number), [eh,em]=end.split(':').map(Number);
  let d = (eh*60+em) - (sh*60+sm);
  if(d < 0) d += 24*60;          // 자정 넘김
  return d;
}
function relDate(s){
  if(!s) return '';
  const t = new Date(s+'T00:00:00').getTime();
  const days = Math.round((new Date(todayStr()+'T00:00:00').getTime() - t)/86400000);
  if(days === 0) return '오늘';
  if(days === 1) return '어제';
  if(days < 7)  return `${days}일 전`;
  if(days < 35) return `${Math.floor(days/7)}주 전`;
  if(days < 365)return `${Math.floor(days/30)}개월 전`;
  return `${Math.floor(days/365)}년 전`;
}

}

/* ============================================================
   IndexedDB
   ============================================================ */
const DB_NAME='badagaja', DB_VER=1;
let _db = null;

function openDB(){
  return new Promise((res,rej)=>{
    const rq = indexedDB.open(DB_NAME, DB_VER);
    rq.onupgradeneeded = e => {
      const db = e.target.result;
      if(!db.objectStoreNames.contains('points')) db.createObjectStore('points',{keyPath:'id'});
      if(!db.objectStoreNames.contains('trips')){
        const s = db.createObjectStore('trips',{keyPath:'id'});
        s.createIndex('pointId','pointId');
      }
      if(!db.objectStoreNames.contains('images')) db.createObjectStore('images',{keyPath:'id'});
      if(!db.objectStoreNames.contains('meta'))   db.createObjectStore('meta',{keyPath:'k'});
    };
    rq.onsuccess = () => { _db = rq.result; res(_db); };
    rq.onerror   = () => rej(rq.error);
  });
}
function tx(store, mode='readonly'){ return _db.transaction(store, mode).objectStore(store); }
function req(r){ return new Promise((res,rej)=>{ r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
const dbAll = s => req(tx(s).getAll());
const dbPut = (s,v) => req(tx(s,'readwrite').put(v));
const dbGet = (s,k) => req(tx(s).get(k));

/* ============================================================
   이미지 — 압축 · 저장 · 표시
   ============================================================ */
const IMG_MAX = 1600, IMG_Q = 0.8;      // 원본 보관용
const THUMB_MAX = 400, THUMB_Q = 0.7;   // 목록·그리드용

/** 한 변을 max 이하로 줄여 JPEG 로 다시 굽는다 */
async function shrink(bmp, max, quality){
  const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const w = Math.round(bmp.width * scale), h = Math.round(bmp.height * scale);
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  cv.getContext('2d').drawImage(bmp, 0, 0, w, h);
  const blob = await new Promise(res => cv.toBlob(res, 'image/jpeg', quality));
  return { blob, w, h };
}

/** 파일 하나를 압축해 images 스토어에 넣고 id 를 돌려준다 */
async function addImage(file, ownerType, ownerId, kind){
  // EXIF 회전 정보를 반영해서 읽는다 (안 하면 세로 사진이 눕는다)
  const bmp = await createImageBitmap(file, { imageOrientation:'from-image' });
  const full  = await shrink(bmp, IMG_MAX, IMG_Q);
  const thumb = await shrink(bmp, THUMB_MAX, THUMB_Q);
  bmp.close?.();
  const rec = {
    id: uid(), ownerType, ownerId, kind,
    blob: full.blob, thumb: thumb.blob,
    w: full.w, h: full.h, bytes: full.blob.size,
    createdAt: now(), updatedAt: now(), deleted:false, synced:false
  };
  await dbPut('images', rec);
  scheduleSync();
  return rec.id;
}
async function delImage(id){
  const r = await dbGet('images', id);
  if(r){ r.deleted = true; r.blob = null; r.thumb = null; r.updatedAt = now(); r.synced = false; await dbPut('images', r); }
  for(const cache of [thumbUrls, fullUrls]){
    const u = cache.get(id);
    if(u){ URL.revokeObjectURL(u); cache.delete(id); }
  }
}

/* 만들어 둔 objectURL 은 재사용한다 (매번 만들면 메모리가 샌다) */
const thumbUrls = new Map(), fullUrls = new Map();
async function imgUrl(id, big){
  const cache = big ? fullUrls : thumbUrls;
  if(cache.has(id)) return cache.get(id);
  const r = await dbGet('images', id);
  const blob = r && !r.deleted ? (big ? r.blob : (r.thumb || r.blob)) : null;
  if(!blob) return '';
  const url = URL.createObjectURL(blob);
  cache.set(id, url);
  return url;
}
/** 화면에 그려진 자리표시자들을 뒤늦게 실제 이미지로 채운다 */
async function paintImages(root){
  for(const el of (root || document).querySelectorAll('[data-imgsrc]')){
    const id = el.dataset.imgsrc;
    el.removeAttribute('data-imgsrc');
    const url = await imgUrl(id, false);
    if(!url) continue;
    if(el.tagName === 'IMG') el.src = url;
    else { el.style.backgroundImage = `url("${url}")`; el.classList.add('hasimg'); }
  }
}

/* 포인트/출조 기록이 들고 있는 이미지 목록 (옛 필드도 받아준다) */
const mapImagesOf = p => (p.mapImages || []);
const photosOf    = o => (o.photos || o.images || []);
const coverImageOf = p => mapImagesOf(p)[0] || photosOf(p)[0] || null;

/**
 * 앱에 있는 모든 이미지를 최신순으로 모은다.
 * id 앞부분이 Date.now().toString(36) 이라 id 만으로 시간순 정렬이 된다 (blob 을 읽지 않아도 됨).
 */
function allImages(){
  const out = [];
  for(const p of state.points){
    for(const id of mapImagesOf(p)) out.push({ id, pointId:p.id, title:p.title, kind:'map' });
    for(const id of photosOf(p))    out.push({ id, pointId:p.id, title:p.title, kind:'photo' });
  }
  for(const t of state.trips){
    const p = pointById(t.pointId);
    if(!p) continue;
    for(const id of photosOf(t)) out.push({ id, pointId:p.id, title:p.title, kind:'trip', date:t.date });
  }
  return out.sort((a,b) => b.id.localeCompare(a.id));
}

/** 주인이 사라진 이미지 정리 — 저장하지 않고 나간 편집 화면이 남긴 것들 */
async function sweepOrphanImages(){
  const live = new Set();
  for(const p of state.points){ mapImagesOf(p).forEach(i=>live.add(i)); photosOf(p).forEach(i=>live.add(i)); }
  for(const t of state.trips){ photosOf(t).forEach(i=>live.add(i)); }
  for(const r of await dbAll('images')){
    if(r.deleted || live.has(r.id)) continue;
    if(now() - r.createdAt < 10*60*1000) continue;   // 편집 중일 수 있으니 10분은 봐준다
    await delImage(r.id);
  }
}

const state = {
  points : [],
  trips  : [],
  presets: JSON.parse(JSON.stringify(DEFAULT_PRESETS)),

};

async function loadAll(){
  state.points = (await dbAll('points')).filter(p=>!p.deleted);
  state.trips  = (await dbAll('trips')).filter(t=>!t.deleted);
  const m = await dbGet('meta','presets');
  if(m && m.v) state.presets = m.v;
  const u = await dbGet('meta','ui');
  if(u && u.v) Object.assign(state.ui, u.v);
}
const saveUI      = () => dbPut('meta',{k:'ui', v:state.ui});
const savePresets = () => dbPut('meta',{k:'presets', v:state.presets});

/* ---- 레코드 조작 (tombstone 방식) ---- */
async function putPoint(p){
  p.updatedAt = now(); p.synced = false;
  await dbPut('points', p);
  const i = state.points.findIndex(x=>x.id===p.id);
  if(i>=0) state.points[i]=p; else state.points.push(p);
  scheduleSync();
}
async function putTrip(t){
  t.updatedAt = now(); t.synced = false;
  await dbPut('trips', t);
  const i = state.trips.findIndex(x=>x.id===t.id);
  if(i>=0) state.trips[i]=t; else state.trips.push(t);
  scheduleSync();
}
async function delPoint(id){
  const p = await dbGet('points', id);
  if(p){
    for(const i of [...mapImagesOf(p), ...photosOf(p)]) await delImage(i);
    p.deleted=true; p.updatedAt=now(); p.synced=false; await dbPut('points',p);
  }
  for(const t of state.trips.filter(t=>t.pointId===id)){
    for(const i of photosOf(t)) await delImage(i);
    t.deleted=true; t.updatedAt=now(); t.synced=false; await dbPut('trips',t);
  }
  state.points = state.points.filter(x=>x.id!==id);
  state.trips  = state.trips.filter(x=>x.pointId!==id);
}
async function delTrip(id){
  const t = await dbGet('trips', id);
  if(t){
    for(const i of photosOf(t)) await delImage(i);
    t.deleted=true; t.updatedAt=now(); t.synced=false; await dbPut('trips',t);
  }
  state.trips = state.trips.filter(x=>x.id!==id);
}

/* ---- 파생 조회 ---- */
const pointById = id => state.points.find(p=>p.id===id);
const tripsOf   = id => state.trips.filter(t=>t.pointId===id)
                          .sort((a,b)=> (b.date||'').localeCompare(a.date||'') || b.createdAt-a.createdAt);
const lastTripDate = id => { const t = tripsOf(id)[0]; return t ? t.date : ''; };

/** 장소 3뎁스 학습형 후보 */
function placeCandidates(depth, sido, sigungu){
  const set = new Set();
  for(const p of state.points){
    if(depth===1){ if(p.sido) set.add(p.sido); }
    else if(depth===2){ if(p.sido===sido && p.sigungu) set.add(p.sigungu); }
    else { if(p.sido===sido && p.sigungu===sigungu && p.placeName) set.add(p.placeName); }
  }
  let arr = [...set].sort((a,b)=>a.localeCompare(b,'ko'));
  if(depth===1) arr = [...new Set([...arr, ...SIDO])];   // 시/도는 프리셋 합침
  return arr;
}

/** 검색 대상 텍스트 (포인트 + 소속 출조기록) */
function searchBlob(p){
  const parts = [p.title, p.content, p.sido, p.sigungu, p.placeName];
  (p.catches||[]).forEach(c=>parts.push(c.name, c.note));
  (p.seasons||[]).forEach(s=>parts.push(...seasonItems(s)));
  for(const t of state.trips){
    if(t.pointId!==p.id) continue;
    parts.push(t.memo, t.date);
    (t.catches||[]).forEach(c=>parts.push(c.name, c.note, c.size));
  }
  return parts.filter(Boolean).join(' ').toLowerCase();
}

function visiblePoints(){
  const {tab,q,sort} = state.ui;
  let arr = state.points.slice();
  if(tab!=='all') arr = arr.filter(p=>p.type===tab);
  const needle = q.trim().toLowerCase();
  if(needle){
    const words = needle.split(/\s+/);
    arr = arr.filter(p=>{ const b = searchBlob(p); return words.every(w=>b.includes(w)); });
  }
  if(sort==='updated')   arr.sort((a,b)=>b.updatedAt-a.updatedAt);
  else if(sort==='name') arr.sort((a,b)=>(a.title||'').localeCompare(b.title||'','ko'));
  else if(sort==='trip') arr.sort((a,b)=>(lastTripDate(b.id)||'').localeCompare(lastTripDate(a.id)||''));
  return arr;
}

/* ============================================================
   ZIP 만들기 / 읽기 — 외부 라이브러리 없이, 압축 없는(store) 방식.
   사진(JPEG)은 이미 압축돼 있어서 다시 압축해봐야 얻는 게 없다.
   ============================================================ */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for(let n = 0; n < 256; n++){
    let c = n;
    for(let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(buf){
  let c = 0xFFFFFFFF;
  for(let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
const enc = new TextEncoder();

/** @param {Array<{name:string, data:Uint8Array}>} files */
function zipWrite(files){
  const chunks = [], central = [];
  let offset = 0;
  const u16 = n => [n & 255, (n >>> 8) & 255];
  const u32 = n => [n & 255, (n >>> 8) & 255, (n >>> 16) & 255, (n >>> 24) & 255];

  for(const f of files){
    const name = enc.encode(f.name);
    const crc = crc32(f.data), size = f.data.length;
    // 0x0800 = 이름이 UTF-8 이라는 표시 (한글 파일명 대비)
    const local = new Uint8Array([
      ...u32(0x04034b50), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0),
      ...u32(crc), ...u32(size), ...u32(size), ...u16(name.length), ...u16(0), ...name
    ]);
    chunks.push(local, f.data);
    central.push(new Uint8Array([
      ...u32(0x02014b50), ...u16(20), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0),
      ...u32(crc), ...u32(size), ...u32(size), ...u16(name.length),
      ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(offset), ...name
    ]));
    offset += local.length + size;
  }
  const cdSize = central.reduce((a, c) => a + c.length, 0);
  const eocd = new Uint8Array([
    ...u32(0x06054b50), ...u16(0), ...u16(0),
    ...u16(files.length), ...u16(files.length), ...u32(cdSize), ...u32(offset), ...u16(0)
  ]);
  return new Blob([...chunks, ...central, eocd], { type:'application/zip' });
}

/** @returns {Promise<Map<string, Uint8Array>>} */
async function zipRead(blob){
  const buf = new Uint8Array(await blob.arrayBuffer());
  const dv = new DataView(buf.buffer);
  let eocd = -1;
  for(let i = buf.length - 22; i >= 0 && i > buf.length - 66000; i--){
    if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) throw new Error('올바른 백업 파일이 아닙니다');
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const out = new Map();
  const dec = new TextDecoder();
  for(let i = 0; i < count; i++){
    if(dv.getUint32(p, true) !== 0x02014b50) throw new Error('백업 파일이 손상되었습니다');
    const method  = dv.getUint16(p + 10, true);
    const size    = dv.getUint32(p + 24, true);
    const nameLen = dv.getUint16(p + 28, true);
    const extraLen= dv.getUint16(p + 30, true);
    const cmtLen  = dv.getUint16(p + 32, true);
    const lo      = dv.getUint32(p + 42, true);
    const name    = dec.decode(buf.subarray(p + 46, p + 46 + nameLen));
    if(method !== 0) throw new Error('압축된 백업은 읽을 수 없습니다');
    const lNameLen  = dv.getUint16(lo + 26, true);
    const lExtraLen = dv.getUint16(lo + 28, true);
    const start = lo + 30 + lNameLen + lExtraLen;
    out.set(name, buf.subarray(start, start + size));
    p += 46 + nameLen + extraLen + cmtLen;
  }
  return out;
}

/* ============================================================
   백업 파일 방식 — 계정도 서버도 없이, 파일 하나로 통째 보관
   ============================================================ */

/** 백업에 담을 이미지 (포인트 이미지는 항상, 나머지는 옵션) */
async function imagesForBackup(){
  return (await dbAll('images')).filter(r => !r.deleted && r.blob && (r.kind === 'map' || SYNC.extras));
}

async function buildBackup(onStep){
  const step = onStep || (()=>{});
  step('기록 모으는 중…');
  const points = (await dbAll('points')).filter(r => !r.deleted);
  const trips  = (await dbAll('trips')).filter(r => !r.deleted);
  const imgs   = await imagesForBackup();

  const files = [{
    name: 'badagaja.json',
    data: enc.encode(JSON.stringify({
      app:'badagaja', version:2, exportedAt:new Date().toISOString(),
      points, trips, presets: state.presets,
      images: imgs.map(r => ({ id:r.id, ownerType:r.ownerType, ownerId:r.ownerId, kind:r.kind,
                               w:r.w, h:r.h, bytes:r.bytes, createdAt:r.createdAt }))
    }, null, 1))
  }];
  for(let i = 0; i < imgs.length; i++){
    step(`사진 ${i+1}/${imgs.length} 담는 중…`);
    files.push({ name:`images/${imgs[i].id}.jpg`,
                 data:new Uint8Array(await imgs[i].blob.arrayBuffer()) });
  }
  step('파일 만드는 중…');
  return { blob: zipWrite(files), points:points.length, trips:trips.length, images:imgs.length };
}

/** 백업 파일을 시스템 공유창으로 넘긴다 (드라이브·MyBox 등 아무 데나 저장 가능) */
async function shareBackup(onStep){
  const r = await buildBackup(onStep);
  const name = `바다가자-백업-${todayStr()}.zip`;
  const file = new File([r.blob], name, { type:'application/zip' });
  let shared = false;
  try{
    if(navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title:'바다가자 백업' });
      shared = true;
    }
  }catch(e){
    if(e && e.name === 'AbortError') return null;   // 사용자가 취소
    console.warn('공유 실패, 내려받기로 대체', e);
  }
  if(!shared){
    const a = document.createElement('a');
    a.href = URL.createObjectURL(r.blob);
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 8000);
  }
  state.ui.backupAt = now(); saveUI();
  return r;
}

async function restoreBackup(file, onStep){
  const step = onStep || (()=>{});
  step('백업 파일 읽는 중…');
  const entries = await zipRead(file);
  const metaRaw = entries.get('badagaja.json');
  if(!metaRaw) throw new Error('백업 파일 안에 기록이 없습니다');
  const data = JSON.parse(new TextDecoder().decode(metaRaw));
  if(data.app !== 'badagaja') throw new Error('바다가자 백업이 아닙니다');

  for(const p of (data.points||[])) await dbPut('points', p);
  for(const t of (data.trips ||[])) await dbPut('trips',  t);
  if(data.presets) { state.presets = data.presets; await savePresets(); }

  const metas = data.images || [];
  let got = 0;
  for(let i = 0; i < metas.length; i++){
    const m = metas[i];
    const bytes = entries.get(`images/${m.id}.jpg`);
    if(!bytes) continue;
    step(`사진 ${i+1}/${metas.length} 복원 중…`);
    const blob = new Blob([bytes], { type:'image/jpeg' });
    const bmp = await createImageBitmap(blob);
    const th  = await shrink(bmp, THUMB_MAX, THUMB_Q);
    bmp.close?.();
    await dbPut('images', Object.assign({}, m, {
      blob, thumb: th.blob, deleted:false, synced:false,
      updatedAt: m.createdAt || now()
    }));
    got++;
  }
  await loadAll();
  step('완료');
  return { points:(data.points||[]).length, trips:(data.trips||[]).length, images:got };
}

/** 마지막 백업 이후 바뀐 것이 몇 건인지 */
function changedSinceBackup(){
  const since = state.ui.backupAt || 0;
  return state.points.filter(p => p.updatedAt > since).length
       + state.trips.filter(t => t.updatedAt > since).length;
}

/* ============================================================
   클라우드 동기화 (선택) — Google Sheets + Apps Script
   URL/토큰을 넣지 않으면 앱은 완전히 로컬로만 동작한다.
   ============================================================ */
const SYNC = {
  get enabled() { return !!state.ui.syncOn; },        // 사용자가 켠 스위치
  get mode()    { return state.ui.syncMode || 'file'; }, // 'file' = 백업 파일, 'sheet' = 구글 시트
  get url()     { return (state.ui.syncUrl   || '').trim(); },
  get token()   { return (state.ui.syncToken || '').trim(); },
  get extras()  { return !!state.ui.syncExtras; },    // 기타·출조 사진까지 올릴지 (기본 꺼짐)
  get ready()   { return !!(this.url && this.token); }, // 주소·토큰이 채워졌는지
  // 구글 시트 방식이 실제로 동작하는 상태
  get on()      { return this.enabled && this.mode === 'sheet' && this.ready; }
};

async function api(op, body){
  /* Content-Type 을 text/plain 으로 보낸다.
     application/json 이면 브라우저가 preflight(OPTIONS)를 보내는데
     Apps Script 웹앱은 OPTIONS 를 처리하지 못해 CORS 로 막힌다. */
  const res = await fetch(SYNC.url, {
    method : 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body   : JSON.stringify(Object.assign({ token: SYNC.token, op }, body || {})),
    redirect: 'follow'
  });
  if(!res.ok) throw new Error('서버 응답 ' + res.status);
  let j;
  try { j = await res.json(); }
  catch { throw new Error('응답을 읽지 못했습니다 (주소가 맞는지 확인해 주세요)'); }
  if(!j.ok) throw new Error(j.error || '알 수 없는 오류');
  return j;
}

const blobToB64 = blob => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload  = () => res(String(r.result).split(',')[1] || '');
  r.onerror = rej;
  r.readAsDataURL(blob);
});
function b64ToBlob(b64, type){
  const bin = atob(b64);
  const buf = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  return new Blob([buf], { type });
}

/** 올려야 할 이미지 — 포인트 이미지는 무조건, 나머지는 설정에 따라 */
async function imagesToPush(){
  return (await dbAll('images')).filter(r => !r.synced && (r.kind === 'map' || SYNC.extras));
}
async function unsyncedCount(){
  const p = (await dbAll('points')).filter(r => !r.synced).length;
  const t = (await dbAll('trips')).filter(r => !r.synced).length;
  const i = (await imagesToPush()).length;
  return { points:p, trips:t, images:i, total:p+t+i };
}

let syncing = false;
/**
 * 미동기화분을 올린다.
 * @param {Function} onStep 진행 상황을 받을 콜백 (없으면 조용히)
 */
async function syncNow(onStep){
  if(!SYNC.enabled) throw new Error('동기화가 꺼져 있습니다');
  if(!SYNC.ready)   throw new Error('주소와 토큰을 입력해 주세요');
  if(syncing) return;
  syncing = true;
  const step = onStep || (()=>{});
  try{
    const pts = (await dbAll('points')).filter(r => !r.synced);
    const trs = (await dbAll('trips')).filter(r => !r.synced);
    if(pts.length || trs.length){
      step(`기록 ${pts.length + trs.length}건 올리는 중…`);
      await api('push_records', { points: pts, trips: trs });
      for(const r of pts){ r.synced = true; await dbPut('points', r); }
      for(const r of trs){ r.synced = true; await dbPut('trips',  r); }
    }
    const imgs = await imagesToPush();
    for(let k = 0; k < imgs.length; k++){
      const r = imgs[k];
      step(`사진 ${k+1}/${imgs.length} 올리는 중…`);
      const meta = { id:r.id, ownerType:r.ownerType, ownerId:r.ownerId, kind:r.kind,
                     w:r.w, h:r.h, bytes:r.bytes,
                     createdAt:r.createdAt, updatedAt:r.updatedAt, deleted:!!r.deleted };
      const data = (r.deleted || !r.blob) ? '' : await blobToB64(r.blob);
      await api('push_image', { image: meta, data });   // 실행시간 제한 때문에 한 장씩
      r.synced = true; await dbPut('images', r);
    }
    state.ui.syncedAt = now(); saveUI();
    step('완료');
    return { records: pts.length + trs.length, images: imgs.length };
  } finally { syncing = false; }
}

/** 클라우드에서 통째로 내려받아 로컬을 채운다 (새로 설치했을 때) */
async function restoreFromCloud(onStep){
  if(!SYNC.enabled) throw new Error('동기화가 꺼져 있습니다');
  if(!SYNC.ready)   throw new Error('주소와 토큰을 입력해 주세요');
  const step = onStep || (()=>{});
  step('기록 받는 중…');
  const j = await api('pull_records', {});
  for(const p of (j.points||[])) await dbPut('points', Object.assign({}, p, { synced:true }));
  for(const t of (j.trips ||[])) await dbPut('trips',  Object.assign({}, t, { synced:true }));

  const metas = (j.images||[]).filter(m => m.id && !m.deleted && m.driveId);
  let got = 0;
  for(let k = 0; k < metas.length; k++){
    const m = metas[k];
    const have = await dbGet('images', m.id);
    if(have && have.blob) continue;                    // 이미 있는 건 건너뛴다
    step(`사진 ${k+1}/${metas.length} 받는 중…`);
    try{
      const im = await api('pull_image', { id: m.id });
      const blob = b64ToBlob(im.data, 'image/jpeg');
      // 썸네일은 서버에 없으니 받아서 다시 만든다
      const bmp = await createImageBitmap(blob);
      const th  = await shrink(bmp, THUMB_MAX, THUMB_Q);
      bmp.close?.();
      await dbPut('images', Object.assign({}, m, {
        blob, thumb: th.blob, deleted:false, synced:true
      }));
      got++;
    }catch(e){ console.error('이미지 복원 실패', m.id, e); }
  }
  await loadAll();
  step('완료');
  return { points:(j.points||[]).length, trips:(j.trips||[]).length, images:got };
}

/* 저장할 때마다 잠깐 기다렸다가 조용히 올린다 */
let syncTimer = null;
function scheduleSync(){
  if(!SYNC.on || !navigator.onLine) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => { syncNow().catch(e => console.warn('자동 동기화 실패', e)); }, 4000);
}

/** 설치된 앱으로 공유가 들어왔는지 확인하고, 주소창은 깨끗이 정리한다 */
function captureShare(){
  const sp  = new URLSearchParams(location.search);
  const txt = (sp.get('share_url') || '') + ' ' + (sp.get('share_text') || '');
  const ttl = sp.get('share_title') || '';
  if(!txt.trim() && !ttl) return false;
  const url = (txt.match(/https?:\/\/\S+/) || [''])[0];
  pendingShare = { url, title: (ttl || txt.replace(/https?:\/\/\S+/g,'')).trim() };
  history.replaceState(null, '', location.pathname);
  return !!(url || pendingShare.title);
}

/** 자유입력 가능한 필터형 콤보박스 */
function attachCombo(input, getCandidates){
  let pop = null;
  const close = () => { if(pop){ pop.remove(); pop = null; } };

  const open = () => {
    close();
    const typed = input.value.trim();
    let cands = getCandidates() || [];
    if(typed){
      const low = typed.toLowerCase();
      cands = cands.filter(c => c.toLowerCase().includes(low));
    }
    const exact = cands.some(c => c === typed);
    if(!cands.length && !typed) return;
    // 고를 것이 없으면(입력값과 후보가 정확히 일치하는 1건뿐) 열지 않는다.
    // 안 그러면 드롭다운이 아래 입력칸을 덮어 다음 항목을 못 누른다.
    if(exact && cands.length === 1) return;

    pop = document.createElement('div');
    pop.className = 'combo-pop';
    let html = '';
    if(typed && !exact) html += `<button type="button" class="newitem" data-v="${esc(typed)}">＋ "${esc(typed)}" 새로 추가</button>`;
    html += cands.slice(0,60).map(c=>`<button type="button" data-v="${esc(c)}">${esc(c)}</button>`).join('');
    if(!html) return;
    pop.innerHTML = html;
    pop.addEventListener('mousedown', e => e.preventDefault());
    pop.addEventListener('click', e => {
      const b = e.target.closest('button[data-v]');
      if(!b) return;
      input.value = b.dataset.v;
      input.dispatchEvent(new Event('change',{bubbles:true}));
      close();
    });
    input.parentElement.appendChild(pop);
  };

  input.addEventListener('focus', open);
  input.addEventListener('input', open);
  input.addEventListener('blur', () => setTimeout(close, 150));
  // 바깥을 누르면 즉시 닫아서, 열린 목록이 다른 조작을 가로막지 않게 한다
  document.addEventListener('pointerdown', e => {
    if(pop && !input.parentElement.contains(e.target)) close();
  }, true);
}

/**
 * 조과물 편집기
 * @param {HTMLElement} host   컨테이너
 * @param {Array} model        Catch[] (직접 변형됨)
 * @param {Function} getType   () => 'walking' | 'haerujil'  (포인트 타입이 바뀌어도 따라감)
 * @param {boolean} withQty    수량 입력 여부
 * @returns {{refresh:Function}}
 */
function catchEditor(host, model, getType, withQty){
  let showAll = false;

  function render(){
    const type  = getType();
    const other = type==='walking' ? 'haerujil' : 'walking';
    const presets = showAll
      ? [...state.presets[type], ...state.presets[other].filter(x=>!state.presets[type].includes(x))]
      : state.presets[type];
    const chosen = new Set(model.map(c=>c.name));

    let selHtml;
    if(!model.length){
      selHtml = `<div class="muted">아직 추가된 항목이 없습니다.</div>`;
    } else if(withQty){
      selHtml = model.map((c,i)=>`
        <div class="editrow">
          <div class="input" style="flex:1;background:var(--bg)">${esc(c.name)}</div>
          <div class="qtybox">
            <button type="button" data-qty="-1" data-i="${i}">−</button>
            <span>${c.qty ?? 1}</span>
            <button type="button" data-qty="1" data-i="${i}">＋</button>
          </div>
          <button type="button" class="delrow" data-del="${i}">${ICON.trash}</button>
        </div>`).join('');
    } else {
      selHtml = `<div class="chips">` + model.map((c,i)=>
        `<button type="button" class="chip sel" data-del="${i}">${esc(c.name)}<span class="x">×</span></button>`
      ).join('') + `</div>`;
    }

    host.innerHTML = selHtml + `
      <div class="presetbox">
        <div class="ttl">
          <span>자주 쓰는 항목 · ${showAll?'전체':TYPE[type].label}</span>
          <button type="button" data-toggle>${showAll?'해당 타입만':'전체 보기'}</button>
        </div>
        <div class="chips">
          ${presets.map(n=>`<button type="button" class="chip" data-add="${esc(n)}"${chosen.has(n)?' style="opacity:.35"':''}>${esc(n)}</button>`).join('')}
        </div>
        <div class="addrow">
          <input class="input" placeholder="직접 입력" data-custom>
          <button type="button" class="btn-sm" data-addcustom>추가</button>
        </div>
      </div>`;
  }

  function add(name){
    name = (name||'').trim();
    if(!name) return;
    if(model.some(c=>c.name===name)){ toast('이미 추가된 항목입니다'); return; }
    model.push(withQty ? {name, qty:1} : {name});
    // 프리셋에 없는 새 이름이면 현재 타입 프리셋에 학습
    const type = getType();
    if(!state.presets.walking.includes(name) && !state.presets.haerujil.includes(name)){
      state.presets[type].push(name); savePresets();
    }
    render();
  }

  host.addEventListener('click', e => {
    const t = e.target;
    if(t.closest('[data-toggle]')){ showAll=!showAll; return render(); }
    const addBtn = t.closest('[data-add]');
    if(addBtn) return add(addBtn.dataset.add);
    if(t.closest('[data-addcustom]')){
      const inp = host.querySelector('[data-custom]');
      add(inp.value); inp.value=''; return;
    }
    const del = t.closest('[data-del]');
    if(del){ model.splice(+del.dataset.del,1); return render(); }
    const q = t.closest('[data-qty]');
    if(q){
      const i = +q.dataset.i;
      model[i].qty = Math.max(0, (model[i].qty ?? 1) + (+q.dataset.qty));
      return render();
    }
  });
  host.addEventListener('keydown', e => {
    if(e.key==='Enter' && e.target.matches('[data-custom]')){
      e.preventDefault(); add(e.target.value); e.target.value='';
    }
  });
  render();
  return { refresh: render };
}

/** 시즌 메모의 항목 목록 — 옛 버전의 text 도 항목 하나로 취급한다 */
function seasonItems(s){
  if(Array.isArray(s.items)) return s.items;
  return (s.text||'').trim() ? [s.text.trim()] : [];
}

/**
 * 시즌(월별/기간별) 메모 편집기 — 조과물처럼 프리셋 칩 + 직접 입력으로 고른다.
 * @param {Function} getType () => 'walking' | 'haerujil'
 * @returns {{refresh:Function}}
 */
function seasonEditor(host, model, getType){
  let openIdx = -1, showAll = false;

  function monthSel(field, i, val){
    return `<select class="input" data-sf="${field}" data-i="${i}">${
      MONTHS.map(m=>`<option value="${m}"${val==m?' selected':''}>${m}월</option>`).join('')}</select>`;
  }
  function boxHtml(type, chosen, i){
    const other = type==='walking' ? 'haerujil' : 'walking';
    const presets = showAll
      ? [...state.presets[type], ...state.presets[other].filter(x=>!state.presets[type].includes(x))]
      : state.presets[type];
    return `<div class="presetbox">
      <div class="ttl">
        <span>자주 쓰는 항목 · ${showAll?'전체':TYPE[type].label}</span>
        <button type="button" data-stoggle>${showAll?'해당 타입만':'전체 보기'}</button>
      </div>
      <div class="chips">${presets.map(n=>
        `<button type="button" class="chip" data-sadd="${i}|${esc(n)}"${chosen.has(n)?' style="opacity:.35"':''}>${esc(n)}</button>`
      ).join('')}</div>
      <div class="addrow">
        <input class="input" placeholder="직접 입력" data-scustom="${i}">
        <button type="button" class="btn-sm" data-saddcustom="${i}">추가</button>
      </div>
    </div>`;
  }

  function render(){
    // 옛 형식(text) 을 항목 배열로 옮긴다
    model.forEach(s => { if(!Array.isArray(s.items)){ s.items = seasonItems(s); delete s.text; } });
    const type = getType();

    host.innerHTML = (model.length ? model.map((s,i)=>`
      <div class="seasoncard">
        <div class="editrow" style="margin-bottom:8px">
          ${monthSel('fromMonth', i, s.fromMonth)}
          <span class="tilde">~</span>
          ${monthSel('toMonth', i, s.toMonth)}
          <span style="flex:1"></span>
          <button type="button" class="delrow" data-sdel="${i}">${ICON.trash}</button>
        </div>
        <div class="chips">
          ${s.items.map((n,j)=>`<button type="button" class="chip sel" data-srm="${i}.${j}">${esc(n)}<span class="x">×</span></button>`).join('')}
          <button type="button" class="chip addchip" data-sopen="${i}">${openIdx===i?'닫기':'＋ 항목'}</button>
        </div>
        ${openIdx===i ? boxHtml(type, new Set(s.items), i) : ''}
      </div>`).join('')
      : `<div class="muted" style="margin-bottom:8px">등록된 시즌 메모가 없습니다.</div>`)
      + `<button type="button" class="btn ghost" data-addseason style="width:100%">＋ 기간 추가</button>`;
  }

  function add(i, name){
    name = (name||'').trim();
    if(!name) return;
    if(model[i].items.includes(name)){ toast('이미 추가된 항목입니다'); return; }
    model[i].items.push(name);
    const type = getType();
    if(!state.presets.walking.includes(name) && !state.presets.haerujil.includes(name)){
      state.presets[type].push(name); savePresets();
    }
    render();
  }

  host.addEventListener('click', e => {
    const t = e.target;
    if(t.closest('[data-addseason]')){
      const mo = new Date().getMonth()+1;
      model.push({fromMonth:mo, toMonth:mo, items:[]});
      openIdx = model.length - 1;            // 새로 만든 기간은 바로 고를 수 있게 펼친다
      return render();
    }
    const del = t.closest('[data-sdel]');
    if(del){ model.splice(+del.dataset.sdel,1); openIdx = -1; return render(); }

    const open = t.closest('[data-sopen]');
    if(open){ const i = +open.dataset.sopen; openIdx = (openIdx===i ? -1 : i); return render(); }

    const rm = t.closest('[data-srm]');
    if(rm){ const [i,j] = rm.dataset.srm.split('.').map(Number); model[i].items.splice(j,1); return render(); }

    if(t.closest('[data-stoggle]')){ showAll = !showAll; return render(); }

    const ad = t.closest('[data-sadd]');
    if(ad){ const [i,name] = ad.dataset.sadd.split('|'); return add(+i, name); }

    const ac = t.closest('[data-saddcustom]');
    if(ac){
      const i = ac.dataset.saddcustom;
      const inp = host.querySelector(`[data-scustom="${i}"]`);
      add(+i, inp.value); inp.value = ''; return;
    }
  });
  host.addEventListener('keydown', e => {
    if(e.key==='Enter' && e.target.dataset.scustom !== undefined){
      e.preventDefault();
      add(+e.target.dataset.scustom, e.target.value); e.target.value='';
    }
  });
  host.addEventListener('change', e => {
    const f = e.target.dataset.sf;
    if(!f) return;
    model[+e.target.dataset.i][f] = +e.target.value;
  });
  render();
  return { refresh: render };
}

/**
 * 이미지 첨부 편집기
 * @param {HTMLElement} host
 * @param {Array<string>} model  이미지 id 배열 (직접 변형됨)
 * @param {string} ownerType 'point' | 'trip'
 * @param {string} ownerId
 * @param {string} kind 'map' | 'photo'
 * @param {string} addLabel
 */
function imagePicker(host, model, ownerType, ownerId, kind, addLabel){
  const inputId = 'f_' + uid();

  function render(){
    host.innerHTML = `<div class="imgrid">
      ${model.map(id=>`
        <div class="imgcell" data-imgsrc="${id}">
          <button type="button" class="rm" data-rmimg="${id}" aria-label="삭제">${ICON.x}</button>
        </div>`).join('')}
      <button type="button" class="imgadd" data-pick>
        <span>${ICON.plus}</span><span class="lbl">${esc(addLabel)}</span>
      </button>
      <input type="file" id="${inputId}" accept="image/*" multiple hidden>
    </div>`;
    paintImages(host);
  }

  host.addEventListener('click', e => {
    if(e.target.closest('[data-pick]')) return host.querySelector('#'+inputId).click();
    const rm = e.target.closest('[data-rmimg]');
    if(rm){
      const id = rm.dataset.rmimg;
      model.splice(model.indexOf(id), 1);
      delImage(id);
      return render();
    }
  });
  host.addEventListener('change', async e => {
    if(e.target.type !== 'file') return;
    const files = [...e.target.files];
    e.target.value = '';
    if(!files.length) return;
    toast(files.length > 1 ? `사진 ${files.length}장 넣는 중…` : '사진 넣는 중…');
    for(const f of files){
      try { model.push(await addImage(f, ownerType, ownerId, kind)); }
      catch(err){ console.error(err); toast('사진을 읽지 못했습니다'); }
    }
    render();
  });
  render();
  return { refresh: render };
}

/** 전체 화면 이미지 뷰어 */
async function openViewer(ids, startIdx){
  if(!ids.length) return;
  let i = Math.max(0, Math.min(startIdx|0, ids.length-1));
  const el = document.createElement('div');
  el.className = 'viewer';
  el.innerHTML = `
    <div class="vtop">
      <button class="iconbtn" data-close style="color:#fff">${ICON.x}</button>
      <span class="grow" style="flex:1"></span>
      <span class="vcount"></span>
    </div>
    <div class="vimg"><img alt=""></div>
    <div class="vnav">
      <button class="iconbtn" data-prev style="color:#fff">${ICON.back}</button>
      <button class="iconbtn" data-next style="color:#fff;transform:rotate(180deg)">${ICON.back}</button>
    </div>`;
  document.body.appendChild(el);

  const img = el.querySelector('img');
  async function show(){
    img.src = await imgUrl(ids[i], true);
    el.querySelector('.vcount').textContent = `${i+1} / ${ids.length}`;
    el.querySelector('[data-prev]').style.visibility = ids.length>1 ? '' : 'hidden';
    el.querySelector('[data-next]').style.visibility = ids.length>1 ? '' : 'hidden';
  }
  const close = () => {
    // 큰 이미지는 닫을 때 정리한다
    for(const id of ids){ const u = fullUrls.get(id); if(u){ URL.revokeObjectURL(u); fullUrls.delete(id); } }
    el.remove();
  };
  el.addEventListener('click', e => {
    if(e.target.closest('[data-close]')) return close();
    if(e.target.closest('[data-prev]')){ i = (i - 1 + ids.length) % ids.length; return show(); }
    if(e.target.closest('[data-next]')){ i = (i + 1) % ids.length; return show(); }
  });
  // 좌우로 쓸어 넘기기
  let x0 = null;
  el.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, {passive:true});
  el.addEventListener('touchend', e => {
    if(x0 == null) return;
    const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if(Math.abs(dx) < 50) return;
    i = (i + (dx < 0 ? 1 : -1) + ids.length) % ids.length;
    show();
  }, {passive:true});
  show();
}

/** 하단 시트 */
function sheet(title, buttons){
  const bd = document.createElement('div');
  bd.className='backdrop';
  bd.innerHTML = `<div class="sheet">
      <h3>${esc(title)}</h3>
      ${buttons.map((b,i)=>`<button class="btn ${b.style||'ghost'}" data-i="${i}">${esc(b.label)}</button>`).join('')}
      <button class="btn ghost" data-close style="margin-top:4px">닫기</button>
    </div>`;
  bd.addEventListener('click', e=>{
    if(e.target===bd || e.target.closest('[data-close]')) return bd.remove();
    const b = e.target.closest('[data-i]');
    if(b){ bd.remove(); buttons[+b.dataset.i].run(); }
  });
  document.body.appendChild(bd);
}

function locLine(p){
  return [p.sido,p.sigungu,p.placeName].filter(Boolean).join(' › ') || '장소 미지정';
}
/** 리스트에 보여줄 조과물 이름 — 포인트에 적힌 것 우선, 없으면 출조 기록에서 집계 */
function catchNames(p){
  if((p.catches||[]).length) return p.catches.map(c=>c.name);
  const t = {};
  for(const tr of state.trips){
    if(tr.pointId!==p.id) continue;
    for(const c of (tr.catches||[])) t[c.name] = (t[c.name]||0) + (c.qty ?? 1);
  }
  return Object.entries(t).sort((a,b)=>b[1]-a[1]).map(([n])=>n);
}
function catchLine(p, max){
  const names = catchNames(p);
  if(!names.length) return '';
  const shown = names.slice(0,max);
  const rest  = names.length - shown.length;
  return `<div class="catchline">`
    + shown.map(n=>`<span class="cchip">${esc(n)}</span>`).join('')
    + (rest ? `<span class="cchip more">+${rest}</span>` : '')
    + `</div>`;
}
function tripMeta(p){
  const n = tripsOf(p.id).length;
  const last = lastTripDate(p.id);
  const bits = [];
  if(n) bits.push(`출조 ${n}회`);
  if(last) bits.push(relDate(last));
  return bits.join(' · ');
}
function listHtml(items){
  return `<div class="list">` + items.map(p=>`
    <button class="item" data-open="${p.id}">
      <div class="thumb ${p.type}"${coverImageOf(p)?` data-imgsrc="${coverImageOf(p)}"`:''}>${TYPE[p.type].icon}</div>
      <div class="itembody">
        <div class="itemtitle">${esc(p.title||'(제목 없음)')}</div>
        <div class="itemloc">${esc(locLine(p))}</div>
        ${catchLine(p, 4)}
        <div class="itemmeta">
          <span class="badge ${p.type}">${TYPE[p.type].label}</span>
          <span class="sub">${esc(tripMeta(p))}</span>
        </div>
      </div>
    </button>`).join('') + `</div>`;
}
function gridHtml(items){
  return `<div class="grid">` + items.map(p=>`
    <button class="card" data-open="${p.id}">
      <div class="ph ${p.type}"${coverImageOf(p)?` data-imgsrc="${coverImageOf(p)}"`:''}>${TYPE[p.type].icon}</div>
      <div class="cb">
        <div class="itemtitle">${esc(p.title||'(제목 없음)')}</div>
        <div class="itemloc">${esc(locLine(p))}</div>
        ${catchLine(p, 3)}
        <div class="itemmeta">
          <span class="badge ${p.type}">${TYPE[p.type].label}</span>
          <span class="sub">${esc(tripMeta(p))}</span>
        </div>
      </div>
    </button>`).join('') + `</div>`;
}
function emptyHtml(q){
  return q
    ? `<div class="empty"><div class="big">🔍</div><p><b>검색 결과가 없습니다</b></p><p>제목·메모·조과물 이름으로 찾습니다.</p></div>`

}

/* ---------- 지도앱 열기 ----------
   안드로이드 표준 geo: URI를 쓰면 설치된 지도앱을 시스템이 알아서 띄우고,
   여러 개면 선택창을 보여준다. 앱 목록을 우리가 들고 있을 필요가 없다. */

/** 좌표로 지도앱 열기 */
function geoUri(lat, lng, label){
  const l = (label||'').trim();
  return `geo:${lat},${lng}?q=${lat},${lng}${l?`(${encodeURIComponent(l)})`:''}`;
}
/** 검색어로 지도앱 열기 */
function geoSearchUri(query){
  return `geo:0,0?q=${encodeURIComponent((query||'').trim())}`;
}
/** 포인트를 열 때 쓸 주소 — 좌표를 알면 geo:(시스템이 지도앱 선택), 모르면 저장된 주소 그대로 */
function locationUrlOf(p){
  if(p.locMode === 'link' && p.mapLink){
    const c = parseCoordsFromUrl(p.mapLink);
    return c ? geoUri(c.lat, c.lng, p.title) : p.mapLink;
  }
  if(p.lat!=null && p.lng!=null) return geoUri(p.lat, p.lng, p.title);
  if(p.mapLink){
    const c = parseCoordsFromUrl(p.mapLink);
    return c ? geoUri(c.lat, c.lng, p.title) : p.mapLink;
  }
  return '';
}
function openUrl(u){
  if(!u) return toast('저장된 위치가 없습니다');
  location.href = u;
}

function renderPointEdit(id){

  const src = isNew ? null : pointById(id);
  if(!isNew && !src) return go('#/');

  const m = isNew
    ? { id:uid(), type:'walking', sido:'', sigungu:'', placeName:'', title:'', content:'',
        locMode:'coords', lat:null, lng:null, mapLink:'',
        catches:[], seasons:[], mapImages:[], photos:[],
        createdAt:now(), updatedAt:now(), deleted:false, synced:false }
    : JSON.parse(JSON.stringify(src));

  // 지도앱에서 공유로 들어온 위치가 있으면 새 포인트에 채워 넣는다
  let fromShare = false;
  if(isNew && newPointPrefill){
    fromShare = !!newPointPrefill.fromShare;
    delete newPointPrefill.fromShare;
    Object.assign(m, newPointPrefill);
    newPointPrefill = null;
  }
  if(m.mapLink == null) m.mapLink = '';

  if(!Array.isArray(m.catches))   m.catches   = [];
  if(!Array.isArray(m.seasons))   m.seasons   = [];
  if(!Array.isArray(m.mapImages)) m.mapImages = [];
  if(!Array.isArray(m.photos))    m.photos    = Array.isArray(m.images) ? m.images : [];

  // 예전에 저장된 포인트는 모드 정보가 없으니 내용을 보고 정한다

        <div class="sb-t">${ICON.map} 지도앱에서 받은 위치를 넣었습니다</div>
        ${pendingShare&&state.points.length?`<button type="button" data-toexisting>기존 포인트에 넣기 →</button>`:''}
      </div>`:''}

      <div class="field">
        <label class="label">종류 <span class="req">*</span></label>
        <div class="seg">
          <button type="button" data-type="walking"  aria-pressed="${m.type==='walking'}">🎣 워킹낚시</button>
          <button type="button" data-type="haerujil" aria-pressed="${m.type==='haerujil'}">🔦 해루질</button>
        </div>
      </div>

      <div class="field">
        <label class="label">장소 <span class="req">*</span></label>
        <div class="combo" style="margin-bottom:7px">
          <input class="input" data-f="sido" placeholder="시 / 도" value="${esc(m.sido)}" autocomplete="off">
        </div>

          <input class="input" data-f="sigungu" placeholder="구 / 군" value="${esc(m.sigungu)}" autocomplete="off">

  function refreshCoordInfo(){

      coordInfo.textContent = curCoords()

        : '현장에서 「현재위치 가져오기」를 누르면 자동으로 채워집니다.';
      return;
    }
    const u = get('mapLink').value.trim();
    const c = u ? parseCoordsFromUrl(u) : null;
    coordInfo.textContent = !u
      ? '지도앱에서 「공유 → 바다가자」를 누르면 자동으로 들어옵니다.'
      : c ? '📍 주소에서 좌표를 읽었습니다 — 지도앱은 시스템이 골라 띄웁니다'

  }
  function setLocMode(mode){
    m.locMode = mode;
    app.querySelectorAll('[data-loc]').forEach(b => b.setAttribute('aria-pressed', b.dataset.loc===mode));
    app.querySelectorAll('[data-locblock]').forEach(b => b.hidden = (b.dataset.locblock!==mode));
    refreshCoordInfo();
  }
  app.querySelectorAll('[data-loc]').forEach(b => b.onclick = () => setLocMode(b.dataset.loc));

  // 현재 위치 모드
  app.querySelector('[data-gps]').onclick = () => {
    if(!navigator.geolocation) return toast('이 기기에서 위치를 쓸 수 없습니다');
    toast('위치 확인 중…');
    navigator.geolocation.getCurrentPosition(
      pos => {
        get('lat').value = pos.coords.latitude.toFixed(6);
        get('lng').value = pos.coords.longitude.toFixed(6);
        refreshCoordInfo();
        toast('현재 위치를 넣었습니다');
      },
      err => toast('위치를 가져오지 못했습니다 (' + err.code + ')'),
      {enableHighAccuracy:true, timeout:12000, maximumAge:0});
  };
  app.querySelector('[data-openloc]').onclick = () => {
    const c = curCoords();
    if(!c) return toast('먼저 좌표를 넣어 주세요');
    openUrl(geoUri(c.lat, c.lng, get('title').value.trim()));

  ['lat','lng'].forEach(f => get(f).addEventListener('input', refreshCoordInfo));

  // 지도에서 가져오기 모드

  function normalizeLoc(txt){
    const url = (txt.match(/(?:https?:\/\/|geo:)\S+/) || [])[0];
    if(url) return url;
    // 주소가 아니라 좌표만 복사해 온 경우(구글지도에서 좌표 탭)도 받아준다
    const c = parseCoords(txt);
    return c ? geoUri(c.lat, c.lng, get('title').value.trim() || placeQuery()) : '';
  }
  app.querySelector('[data-linkpaste]').onclick = async () => {

    try { txt = await navigator.clipboard.readText(); }
    catch {
      // 클립보드 읽기 권한이 없으면 입력칸을 띄워 직접 붙여넣게 한다 (팝업 없음)
      input.focus();

    }
    const url = normalizeLoc(txt);
    if(!url) return toast('주소도 좌표도 찾지 못했습니다');
    input.value = url;
    refreshCoordInfo();
    toast(parseCoordsFromUrl(url) ? '좌표까지 읽었습니다' : '주소를 넣었습니다');
  };
  // 직접 붙여넣었을 때도 똑같이 정리해 준다
  get('mapLink').addEventListener('paste', e => {
    const txt = (e.clipboardData || window.clipboardData)?.getData('text') || '';
    const url = txt && normalizeLoc(txt);
    if(!url) return;                 // 알아볼 수 없으면 그냥 기본 붙여넣기
    e.preventDefault();
    get('mapLink').value = url;
    refreshCoordInfo();

  /* 지도앱 실행 — 저장된 위치가 있으면 그 자리를 열고, 없으면 지도앱만 띄운다.
     어느 쪽이든 geo: 라서 어떤 지도앱을 쓸지는 시스템이 정한다. */
  app.querySelector('[data-maplaunch]').onclick = () => {
    const u = get('mapLink').value.trim();
    if(u){
      const c = parseCoordsFromUrl(u);
      return openUrl(c ? geoUri(c.lat, c.lng, get('title').value.trim()) : u);
    }
    const q = placeQuery();
    openUrl(q ? geoSearchUri(q) : 'geo:0,0');
  };
  app.querySelector('[data-linkclear]').onclick = () => {
    get('mapLink').value = '';
    refreshCoordInfo();
    get('mapLink').focus();
  };
  get('mapLink').addEventListener('input', refreshCoordInfo);
  refreshCoordInfo();

  // 이미지 첨부
  try {
    imagePicker(app.querySelector('[data-mapimages]'), m.mapImages, 'point', m.id, 'map', '지도 이미지');
    imagePicker(app.querySelector('[data-photos]'),    m.photos,    'point', m.id, 'photo', '사진 추가');
  } catch(err){ console.error(err); toast('이미지 첨부를 열지 못했습니다'); }

  // 하위 편집기 — 하나가 실패해도 저장·뒤로가기는 살아 있어야 한다
  const catchHost = app.querySelector('[data-catches]');
  let ce = { refresh(){} };

  catch(err){ console.error(err); catchHost.innerHTML = '<div class="muted">조과물 편집기를 열지 못했습니다.</div>'; }
  let se = { refresh(){} };

  catch(err){ console.error(err); app.querySelector('[data-seasons]').innerHTML = '<div class="muted">시즌 메모 편집기를 열지 못했습니다.</div>'; }

  const toEx = app.querySelector('[data-toexisting]');
  if(toEx) toEx.onclick = () => go('#/share');

  app.querySelector('[data-back]').onclick = back;
  app.querySelector('[data-save]').onclick = async () => {
    // 검증을 먼저 한다. 검증 전에 m 을 건드리면, 저장이 되돌아왔을 때
    // 화면(편집기가 쥔 배열)과 m 이 어긋나 이후 입력이 조용히 사라진다.
    const title = get('title').value.trim();
    const sido  = get('sido').value.trim();
    const place = get('placeName').value.trim();
    if(!title) return toast('제목을 입력해 주세요');
    if(!sido && !place) return toast('장소를 입력해 주세요');

    m.title     = title;
    m.sido      = sido;
    m.placeName = place;
    m.sigungu   = get('sigungu').value.trim();
    m.content   = get('content').value;
    m.mapLink   = get('mapLink').value.trim();
    if(m.locMode === 'coords'){
      const la = parseFloat(get('lat').value), ln = parseFloat(get('lng').value);
      m.lat = isFinite(la) ? la : null;
      m.lng = isFinite(ln) ? ln : null;
    } else {
      // 링크 모드에서는 주소에서 읽어낸 좌표를 함께 보관한다 (geo: 로 여는 데 쓰인다)
      const c = parseCoordsFromUrl(m.mapLink);
      m.lat = c ? c.lat : null;
      m.lng = c ? c.lng : null;
    }
    // 배열 참조를 바꾸지 않고 제자리에서 비운다 (편집기가 같은 배열을 쥐고 있다)
    for(let i = m.seasons.length - 1; i >= 0; i--){
      if(!seasonItems(m.seasons[i]).length) m.seasons.splice(i, 1);
    }

    await putPoint(m);
    pendingShare = null;
    toast('저장했습니다');
    // 새 포인트는 입력 폼 히스토리를 대체해야 상세에서 뒤로가기가 목록으로 간다
    isNew ? goReplace('#/p/'+m.id) : back();
  };
  const db = app.querySelector('[data-del]');
  if(db) db.onclick = async () => {
    if(!confirm('이 포인트와 소속 출조 기록을 모두 삭제할까요?')) return;
    await delPoint(m.id); toast('삭제했습니다'); go('#/');
  };
}

/**
 * 지도 링크에서 좌표 뽑기.
 * 단축 링크(naver.me / kko.to / maps.app.goo.gl)에는 좌표가 없어 null이 나온다 — 정상이다.
 */
function parseCoordsFromUrl(url){
  if(!url) return null;
  let m;
  // geo:36.686,126.298?q=...  (안드로이드 표준)
  if((m = url.match(/^geo:(-?\d{1,3}\.\d+),(-?\d{1,3}\.\d+)/))) return {lat:+m[1], lng:+m[2]};
  // 구글: .../@36.686,126.298,17z  또는  ?q=36.686,126.298
  if((m = url.match(/@(-?\d{1,3}\.\d+),(-?\d{1,3}\.\d+)/))) return {lat:+m[1], lng:+m[2]};
  if((m = url.match(/[?&](?:q|query|destination|ll)=(-?\d{1,3}\.\d+),(-?\d{1,3}\.\d+)/)))
    return {lat:+m[1], lng:+m[2]};
  // 카카오: /link/map/이름,36.686,126.298
  if((m = url.match(/\/link\/(?:map|to)\/[^/,]*,(-?\d{1,3}\.\d+),(-?\d{1,3}\.\d+)/)))
    return {lat:+m[1], lng:+m[2]};
  // 네이버 웹: ?c=126.298,36.686,15,...  (경도가 먼저다)
  if((m = url.match(/[?&]c=(-?\d{1,3}\.\d+),(-?\d{1,3}\.\d+)/)))
    return {lat:+m[2], lng:+m[1]};
  if((m = url.match(/[?&]lat=(-?\d{1,3}\.\d+)[^]*?[?&]l(?:ng|on)=(-?\d{1,3}\.\d+)/)))
    return {lat:+m[1], lng:+m[2]};
  return null;
}

/** 좌표 문자열 파싱 — 십진수 / 도분초 */
function parseCoords(txt){
  if(!txt) return null;
  const dms = /(\d{1,3})[°\s]+(\d{1,2})['′\s]+([\d.]+)["″\s]*([NSEW北南东西]?)/gi;
  const found = [...txt.matchAll(dms)];
  if(found.length >= 2){
    const v = found.slice(0,2).map(f => {
      let d = (+f[1]) + (+f[2])/60 + (+f[3])/3600;
      if(/[SW]/i.test(f[4]||'')) d = -d;
      return d;
    });
    return {lat:v[0], lng:v[1]};
  }
  const dec = txt.match(/(-?\d{1,3}\.\d+)\D+(-?\d{1,3}\.\d+)/);
  if(dec){
    let a = parseFloat(dec[1]), b = parseFloat(dec[2]);
    if(Math.abs(a) > 90 && Math.abs(b) <= 90) [a,b] = [b,a];   // 순서 뒤바뀐 경우
    if(Math.abs(a) <= 90 && Math.abs(b) <= 180) return {lat:a, lng:b};
  }
  return null;
}

  if(galTab === 'trip')  rows = rows.filter(r => r.kind === 'trip');
  if(galTab === 'photo') rows = rows.filter(r => r.kind === 'photo');

  const tabs = [['all','전체'],['map','포인트'],['photo','기타'],['trip','출조']];

  $('#app').innerHTML = `
  <div class="screen">
    <div class="topbar">
      <div class="topbar-row">
        <button class="iconbtn" data-back>${ICON.back}</button>
        <h1>모든 이미지</h1>
      </div>
      <div class="seg" style="margin-top:10px">
        ${tabs.map(([k,l])=>`<button data-galtab="${k}" aria-pressed="${galTab===k}">${l}</button>`).join('')}
      </div>
      <div class="toolrow"><span class="count">${rows.length}장</span></div>
    </div>
    <div class="body" style="padding-left:6px;padding-right:6px">
      ${rows.length ? `<div class="gallery">${rows.map(r=>`
        <button class="gcell" data-imgsrc="${r.id}" data-goto="${r.pointId}">
          ${KIND_LABEL[r.kind]?`<span class="kindbadge">${KIND_LABEL[r.kind]}</span>`:''}
          <span class="cap">${esc(r.title||'(제목 없음)')}${r.date?` · ${esc(r.date.slice(5).replace('-','/'))}`:''}</span>
        </button>`).join('')}</div>`
      : `<div class="empty"><div class="big">🖼</div><p><b>이미지가 없습니다</b></p>
         <p>포인트나 출조 기록에 사진을 첨부하면 여기 모입니다.</p></div>`}
    </div>
  </div>`;

  const app = $('#app');
  app.querySelector('[data-back]').onclick = back;
  app.querySelectorAll('[data-galtab]').forEach(b => b.onclick = () => {
    state.ui.galTab = b.dataset.galtab; saveUI(); renderGallery();
  });
  app.querySelectorAll('[data-goto]').forEach(b => b.onclick = () => go('#/p/'+b.dataset.goto));
  paintImages(app);
}

/* ============================================================
   화면 5 — 공유로 받은 지도 링크 처리
   ============================================================ */
function renderShare(){
  if(!pendingShare) return go('#/');
  const { url, title } = pendingShare;
  const coords = parseCoordsFromUrl(url);
  const recent = state.points.slice().sort((a,b)=>b.updatedAt-a.updatedAt);

  $('#app').innerHTML = `
  <div class="screen">
    <div class="topbar"><div class="topbar-row">
      <button class="iconbtn" data-back>${ICON.back}</button>
      <h1>기존 포인트에 넣기</h1>
    </div></div>
    <div class="body">
      <div class="section">
        <h2>지도앱에서 받은 위치</h2>
        ${title?`<div class="kv" style="font-weight:650;margin-bottom:4px">${esc(title)}</div>`:''}
        <div class="muted" style="word-break:break-all">${esc(url||'(링크 없음)')}</div>
        ${coords?`<div class="hint" style="margin-top:8px">📍 좌표까지 읽었습니다 — 지도앱을 시스템이 골라 띄울 수 있습니다.</div>`
                :`<div class="hint" style="margin-top:8px">단축 주소라 좌표는 들어있지 않습니다. 그래도 이 주소로 그 자리를 다시 열 수 있습니다.</div>`}
      </div>

      <div class="section">
        <h2>어느 포인트에 넣을까요</h2>
        ${recent.length ? recent.map(p=>`
          <button class="trip" data-attach="${p.id}">
            <div class="tripdate">${esc(p.title||'(제목 없음)')}</div>
            <div class="triptime">${esc(locLine(p))}${p.mapLink?' · 기존 위치를 덮어씁니다':''}</div>
          </button>`).join('') : `<div class="muted">아직 포인트가 없습니다.</div>`}
      </div>

      <button class="btn ghost" data-newpoint style="width:100%">${ICON.plus} 그냥 새 포인트로 만들기</button>
    </div>
  </div>`;

  const app = $('#app');
  app.querySelector('[data-back]').onclick = () => { pendingShare = null; go('#/'); };
  app.querySelector('[data-newpoint]').onclick = () => {
    newPointPrefill = { mapLink:url, title:title||'', locMode:'link', fromShare:true };
    if(coords){ newPointPrefill.lat = coords.lat; newPointPrefill.lng = coords.lng; }
    goReplace('#/p/new');
  };
  app.querySelectorAll('[data-attach]').forEach(b => b.onclick = async () => {
    const p = pointById(b.dataset.attach);
    p.mapLink = url;
    p.locMode = 'link';
    if(coords){ p.lat = coords.lat; p.lng = coords.lng; }
    await putPoint(p);
    pendingShare = null;
    toast('링크를 넣었습니다');
    goReplace('#/p/'+p.id);
  });
}

              `<button class="chip" data-rmpreset="${t}:${i}">${esc(n)}<span class="x">×</span></button>`).join('')}</div>
            <div class="addrow">
              <input class="input" placeholder="항목 추가" data-newpreset="${t}">
              <button class="btn-sm" data-addpreset="${t}">추가</button>

          </div>`).join('')}
